# Les outils du catalogue, épinglés. `mise install` les pose à la version
# mesurée ici, sans curl d'archive ni gestionnaire de paquets système.
#
# uv lance l'outil de l'apprenant dans SON projet (`uv run`), avec ses
# dépendances : les tests de dsoxlab tournent dans l'environnement de
# dsoxlab, qui n'a ni requests ni click (voir CLAUDE.md, « Architecture »).
# Versions relevées le 2026-10-02 (`mise ls-remote uv | tail -1`).

[tools]
uv = "0.12.21"
python = "3.14.8"
# act joue le workflow du lab automatisation-dans-la-ci, le seul qui demande
# Docker. 0.2.89 comme github-actions-training : toute version antérieure à
# 0.2.86 est vulnérable à CVE-2026-34041 et CVE-2026-34042.
act = "0.2.89"
